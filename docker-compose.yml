services:

  freeswitch:
    build: ./freeswitch
    container_name: ivr-freeswitch-container
    image: freeswitch:latest
    privileged: true
    network_mode: "host"
    restart: always

    # ───────────── MEMORY CONTROL ─────────────
    # Pehle koi limit nahi thi (memory.max = max), isliye kernel ke paas
    # container ke andar reclaim karne ki koi wajah hi nahi thi.
    # 5g = host-protection backstop. RSS ~3.0-3.4 GB pe plateau hota hai,
    # to ye limit normally kabhi hit nahi hogi - bas host ko marne se bachayegi.
    # memswap_limit = mem_limit matlab swap band (VoIP me swap = audio glitch).
    mem_limit: 5g
    mem_reservation: 1g
    memswap_limit: 5g
    oom_kill_disable: false

    # ───────────── LOG ROTATION ─────────────
    # daemon.json me ye set tha lekin container usse PEHLE bana tha,
    # isliye apply nahi hua aur json log 30 GB tak pahunch gaya tha.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    # ───────────── ULIMITS ─────────────
    # nofile 1024 tha - 400 max-sessions ke liye bahut kam.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      core: 0
      nproc: 8192

    pids_limit: 2048

    #ports:
    #  - 5060:5060
    #  - 5080:5080
    #  - 8021:8021
    #  - 10000-60000:10000-60000
    environment:
      - MONGO_URI=mongodb://db_pbxcc:qxR3aghkOaZToadsJed3q@103.36.121.197:3815/db_pbxcc?authSource=db_pbxcc
    command: >
      sh -c "mkdir -p /usr/local/freeswitch/conf/autoloadconf &&
      mkdir -p /usr/local/freeswitch/scripts &&
      mkdir -p /usr/local/freeswitch/log/json_cdr &&
      mkdir -p /usr/local/freeswitch/log/json_cdr_archive &&
      exec freeswitch"
    volumes:
      # entrypoint.sh bind-mount: allocator tuning ke liye image rebuild
      # ki zaroorat nahi - host file edit karke recreate karna kaafi hai.
      - /home/ringingo/ringingo_ovh/callcenter/freeswitch/entrypoint.sh:/entrypoint.sh:ro
      - /home/ringingo/ringingo_ovh/callcenter/freeswitch/log:/usr/local/freeswitch/log
      - /home/ringingo/ringingo_ovh/callcenter/freeswitch/log/json_cdr:/usr/local/freeswitch/log/json_cdr
      - /home/ringingo/ringingo_ovh/callcenter/freeswitch/log/json_cdr_archive:/usr/local/freeswitch/log/json_cdr_archive
      - /root/docker/sounds:/usr/local/freeswitch/sounds
      - /home/ringingo/ringingo_ovh/callcenter/freeswitch/conf/autoload_configs/json_cdr.conf.xml:/usr/local/freeswitch/conf/autoload_configs/json_cdr.conf.xml
      - /home/ringingo/ringingo_ovh/callcenter/freeswitch/conf/autoload_configs/event_socket.conf.xml:/usr/local/freeswitch/conf/autoload_configs/event_socket.conf.xml
      - /home/ringingo/ringingo_ovh/callcenter/freeswitch/conf/autoload_configs/lua.conf.xml:/usr/local/freeswitch/conf/autoload_configs/lua.conf.xml
      - /home/ringingo/ringingo_ovh/callcenter/freeswitch/scripts:/usr/local/freeswitch/scripts
      - /home/ringingo/ringingo_ovh/callcenter/freeswitch/conf:/usr/local/freeswitch/conf
